name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Opt JS-based actions into Node 24 ahead of the June 2026 forced switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@^2.0

      - name: Build (cargo tauri build → exe + msi)
        run: cargo tauri build

      # Rename both artifacts with the tag (or short SHA for workflow_dispatch)
      # so the GitHub Release page shows clear "portable" + "installer" names.
      - name: Stage release artifacts
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -notmatch '^v\d') { $ref = "${{ github.sha }}".Substring(0,7) }
          $stage = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/crontab.exe "$stage/Window-Crontab-$ref-portable.exe"
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName "$stage/Window-Crontab-$ref-x64.msi" }
          Get-ChildItem $stage | Format-Table Name, Length

      - name: Upload portable .exe
        uses: actions/upload-artifact@v4
        with:
          name: crontab-portable
          path: release-artifacts/Window-Crontab-*-portable.exe

      - name: Upload .msi installer
        uses: actions/upload-artifact@v4
        with:
          name: crontab-msi
          path: release-artifacts/Window-Crontab-*-x64.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
