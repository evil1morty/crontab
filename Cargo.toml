[package]
name = "crontab"
version = "0.2.0"
edition = "2021"
description = "Windows tray-resident cron manager"
license = "MIT"
repository = "https://github.com/evil1morty/crontab"
readme = "README.md"

[build-dependencies]
tauri-build = { version = "2", features = [] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cron = "0.12"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
directories = "5"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
